name: Aktualizacja transmisji Twitch

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-vods:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Skonfiguruj Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Pobierz ostatnie transmisje
        run: python scripts/update_twitch.py
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}

      - name: Zapisz aktualizację
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add twitch-vods.json
          if git diff --cached --quiet; then
            echo "Brak zmian."
            exit 0
          fi
          git commit -m "Aktualizacja ostatnich transmisji Twitch"
          git push
